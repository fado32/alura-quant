name: Alura Quant

on:
  workflow_dispatch:
  schedule:
    # 3 ejecuciones diarias en hora local de Madrid.
    # GitHub Actions admite timezone IANA y ajusta el horario de verano.
    - cron: '17 12 * * 1-5'
    - cron: '34 16 * * 1-5'
    - cron: '42 21 * * 1-5'


permissions:
  contents: write

concurrency:
  group: alura-quant-production
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Configurar identidad GitHub Actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar Alura Quant
        env:
          IA_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot.py
